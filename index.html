<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 标签栏图标：只留一条，由 src/lib/favicon.ts 按浏览器/系统深浅色改 href。
         原先第二条 link 用 media="(prefers-color-scheme: dark)"，但 Chromium/WebKit 都不生效，已移除 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" data-theme-icon />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 旧版 HashRouter 链接兼容：/#/article/xxx?y=1 → /article/xxx?y=1
      // 必须在应用脚本之前执行，所以放在 head 里（模块脚本是 defer 的，会晚于本段）
      (function () {
        var h = location.hash;
        if (h.indexOf('#/') !== 0) return;
        var rest = h.slice(1);
        var qi = rest.indexOf('?');
        var path = qi < 0 ? rest : rest.slice(0, qi);
        var search = qi < 0 ? location.search : rest.slice(qi);
        try { history.replaceState(null, '', path + search); } catch (e) { /* 老浏览器忽略 */ }
      })();
    </script>
    <meta name="description" content="呓语集 - 记录动漫、随想、读后感与数学学习的个人博客" />
    <title>呓语集</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <style>
      html,body{margin:0;padding:0;height:100%;}
      #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
        background:linear-gradient(160deg,#fdf6ec,#f3e8d8);color:#8a6f4f;font-family:'Noto Serif SC','Source Han Serif SC',"Songti SC","STSong",serif;z-index:9999;}
      #splash .logo{font-size:30px;font-weight:700;letter-spacing:6px;}
      #splash .spinner{width:44px;height:44px;border-radius:50%;border:4px solid rgba(138,111,79,.18);border-top-color:#c89f6b;animation:s 1s linear infinite;}
      @keyframes s{to{transform:rotate(360deg);}}
      #splash .tip{font-size:13px;color:#b39a7c;letter-spacing:1px;}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="spinner"></div>
        <div class="logo">呓语集</div>
        <div class="tip">加载中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function(){
        var s=document.getElementById('splash');
        if(s && s.parentNode){
          s.innerHTML='<div style="text-align:center;line-height:2;padding:0 16px">加载失败或网络较慢<br><button onclick="location.reload()" style="margin-top:12px;padding:8px 22px;border:1px solid #c89f6b;border-radius:22px;background:#fff;color:#8a6f4f;cursor:pointer;font-size:14px">重新加载</button></div>';
        }
      }, 8000);
    </script>
  </body>
</html>
